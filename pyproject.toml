[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-follow-tracker"
version = "0.1.0"
description = "Instagram follow and unfollow tracker with SQLite persistence and notifications."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "instaloader==4.15.2",
]

[project.scripts]
ig-tracker = "instagram_follow_tracker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
